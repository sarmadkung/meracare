# Local development and integration-test infrastructure.
#
# Production uses Supabase-hosted PostgreSQL; this compose file exists so the
# same migrations and integration tests can run offline and in CI.

services:
  postgres:
    image: postgres:17-alpine
    container_name: genxcare-postgres
    environment:
      POSTGRES_USER: genxcare
      POSTGRES_PASSWORD: genxcare
      POSTGRES_DB: genxcare
    # Host port 55432 keeps GenxCare clear of any default Postgres on 5432.
    ports:
      - '55432:5432'
    volumes:
      - genxcare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genxcare -d genxcare']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genxcare-postgres-data:
