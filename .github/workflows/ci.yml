name: CI

# Paused while GitHub Actions is unavailable on this account: every run failed
# within seconds on billing, so pushes and pull requests carried a red mark that
# said nothing about the code. Verification is local in the meantime — see
# docs/IMPLEMENTATION_STATUS.md for the commands each phase is checked with.
#
# To switch it back on, restore the push and pull_request triggers below. The
# jobs themselves are unchanged and need no other edit.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: genxcare
          POSTGRES_PASSWORD: genxcare
          POSTGRES_DB: genxcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genxcare -d genxcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Integration tests run against the service container above.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://genxcare:genxcare@localhost:5432/genxcare?sslmode=disable
        run: go test -race ./...

  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm --filter @genxcare/mobile lint

      - name: Test
        run: pnpm --filter @genxcare/mobile test
